<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#18221a">
<title>京都皇帝早生桐 Q&amp;A｜株式会社SANSEI</title>
<link rel="icon" href="img/icon-32x32.jpg">
<link rel="apple-touch-icon" href="img/icon-192x192.jpg">
<link rel="stylesheet" href="assets/style.css?v=20261106c">
</head>
<body class="kkqa-page">
<div class="kkqa" id="kkqa">
  <header class="kkqa-bar">
    <img class="kkqa-logo" src="img/logo-sansei-h.png" alt="SANSEI" width="118" height="33">
    <div class="kkqa-lang" role="group" aria-label="Language">
      <button class="kkqa-lang__btn" type="button" data-kkqa-lang="ja">日本語</button>
      <button class="kkqa-lang__btn" type="button" data-kkqa-lang="en">English</button>
    </div>
  </header>

  <div class="kkqa-layout">
    <nav class="kkqa-nav" id="kkqa-nav" aria-label="Categories"></nav>
    <main class="kkqa-main">
      <section class="kkqa-intro">
        <div class="kkqa-slider" id="kkqa-slider"></div>
        <div class="kkqa-intro__text">
          <p class="kkqa-intro__eyebrow" id="kkqa-eyebrow"></p>
          <h1 class="kkqa-intro__title" id="kkqa-title"></h1>
          <p class="kkqa-intro__lead" id="kkqa-lead"></p>
        </div>
      </section>

      <div class="kkqa-search">
        <label class="kkqa-sr" for="kkqa-q" id="kkqa-q-label"></label>
        <input class="kkqa-search__input" id="kkqa-q" type="search" autocomplete="off" enterkeyhint="search">
      </div>
      <p class="kkqa-count" id="kkqa-count" aria-live="polite"></p>

      <div class="kkqa-list" id="kkqa-list"></div>
      <noscript><p class="kkqa-empty">JavaScript を有効にしてください。</p></noscript>

      <footer class="kkqa-foot">
        <a class="kkqa-foot__tel" id="kkqa-tel" href="tel:0757489188"></a>
        <p class="kkqa-foot__text" id="kkqa-foot"></p>
        <p class="kkqa-foot__ver" id="kkqa-ver"></p>
        <p class="kkqa-foot__copy">Copyright©2023-2026 SANSEI All Rights Reserved.</p>
      </footer>
    </main>
  </div>
</div>

<script src="assets/qa-data.js?v=20261106c"></script>
<script src="assets/app.js?v=20261106c"></script>
</body>
</html>
